{{ define "main" }}

<p>{{ i18n "welcome" }}</p>

<p>
  <img src="{{ "images/BureauPoste.png" | relURL }}" alt="{{ i18n "coverAlt" }}">
</p>

<h2>{{ i18n "contents" }}</h2>

<ol>
  {{ range (where .Site.RegularPages "Section" "livre").ByWeight }}
    {{ if eq .Section "livre" }}
      <li>
        <a href="{{ .RelPermalink }}" title="{{ .Description }}">{{ .Title }}</a>
      </li>
    {{ end }}
  {{ end }}
</ol>

{{ end }}
